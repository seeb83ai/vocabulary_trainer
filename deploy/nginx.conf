# Nginx reverse-proxy configuration for vocab-trainer
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/vocab-trainer
#   sudo ln -s /etc/nginx/sites-available/vocab-trainer /etc/nginx/sites-enabled/vocab-trainer
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Go binary listens on 127.0.0.1:8080.
# Adjust server_name and the certificate paths to match your deployment.
#
# Certificates:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-host.example.com
# (certbot edits this file to add ssl_certificate / ssl_certificate_key directives.)

# ── HTTP: redirect everything to HTTPS ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name raspberrypi.local;   # replace with your hostname or IP

    # Health-checks and ACME HTTP-01 challenges still work over port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: TLS termination + proxy to Go service ─────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raspberrypi.local;   # replace with your hostname or IP

    # Certificate paths — certbot replaces these.
    ssl_certificate     /etc/letsencrypt/live/raspberrypi.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raspberrypi.local/privkey.pem;

    # Modern TLS profile (Mozilla "intermediate", Jan 2026).
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security response headers ───────────────────────────────────────────
    # HSTS: only ever load this hostname over HTTPS for the next two years.
    # Comment out the preload directive until you've submitted to
    # https://hstspreload.org/ — once preloaded, removal takes months.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The application sets its own X-Content-Type-Options / X-Frame-Options /
    # Referrer-Policy / Content-Security-Policy; nginx does not need to
    # duplicate them.

    # ── Reverse proxy to Go binary ──────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generous read timeout for slow local LLM inference
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
    }
}
