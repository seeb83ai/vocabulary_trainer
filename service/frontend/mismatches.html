{{template "layout" .}}
{{define "content"}}

  <main class="page-main mm-main">

    <div class="mm-head">
      <div>
        <h1 class="page-title" data-i18n="mismatches.title">Mismatches</h1>
        <p class="page-sub" data-i18n="mismatches.subtitle">Words you mixed up with other words you know.</p>
      </div>
      <div id="mm-sort" class="hidden ui-seg" role="group" data-i18n-aria-label="mismatches.sort" aria-label="Sort">
        <button id="mm-sort-often" type="button" aria-pressed="true" data-i18n="mismatches.mostOften">Most often</button>
        <button id="mm-sort-recent" type="button" aria-pressed="false" data-i18n="mismatches.mostRecent">Most recent</button>
      </div>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden tr-card mm-empty">
      <div class="mm-empty-tile hanzi">清</div>
      <h2 class="mm-empty-title" data-i18n="mismatches.noConfusions">No mix-ups yet</h2>
      <p class="mm-empty-body" data-i18n="mismatches.emptyBody">When you type a meaning that belongs to another word, the pair shows up here so you can practise it.</p>
      <a href="/train" class="ui-btn ui-btn-primary" data-i18n="mismatches.toTrain">Go to training</a>
    </div>

    <!-- Error state -->
    <div id="error-state" class="hidden tr-card mm-empty">
      <p id="error-msg" class="mm-empty-body mm-error"></p>
    </div>

    <!-- Pair cards -->
    <div id="mismatches-list" class="hidden mm-list"></div>

  </main>

{{end}}
