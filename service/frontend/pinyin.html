{{template "layout" .}}
{{define "content"}}

  <!-- Sticky bar: session progress, due/total and group chips -->
  <div id="pinyin-bar" class="tr-bar">
    <div class="tr-bar-inner py-bar-inner">
      <div class="tr-progress">
        <div class="tr-progress-row">
          <span id="pinyin-progress-label" class="tr-progress-label">—</span>
          <span id="pinyin-total-label" class="tr-progress-meta">—</span>
        </div>
        <div class="tr-progress-track"><div id="pinyin-progress-bar" class="tr-progress-fill py-progress-fill" style="width:0%"></div></div>
      </div>
      <div id="tag-chips" class="py-chips" role="group" data-i18n-aria-label="pinyin.group" aria-label="Group"></div>
    </div>
  </div>

  <main class="py-main">

    <!-- Empty state -->
    <div id="empty-state" class="hidden tr-card py-state">
      <div class="py-state-tile is-soft hanzi">音</div>
      <h1 class="py-state-title" data-i18n="pinyin.noSounds">No pinyin sounds imported</h1>
      <p class="py-state-body"><span data-i18n="pinyin.noSoundsLead">Import the audio files to start ear training:</span> <code>make import-pinyin</code></p>
    </div>

    <!-- Success state -->
    <div id="success-state" class="hidden tr-card py-state">
      <div class="py-state-tile hanzi">音</div>
      <h1 class="py-state-title" data-i18n="pinyin.allDone">All sounds done for now</h1>
      <p class="py-state-body" data-i18n="pinyin.allDoneMsg">No more pinyin sounds are due. Come back later for review.</p>
      <div class="py-state-actions">
        <a href="/train" class="ui-btn ui-btn-secondary" data-i18n="pinyin.trainWords">Train words</a>
      </div>
    </div>

    <!-- Error state -->
    <div id="error-state" class="hidden tr-card py-state">
      <div class="py-state-tile is-error">!</div>
      <p id="error-msg" class="py-state-body py-error"></p>
    </div>

    <!-- Card area -->
    <div id="card-area" class="hidden">
      <div class="tr-card py-card">
        <div id="mode-label" class="tr-eyebrow py-eyebrow"></div>

        <button id="play-btn" type="button" class="py-play" data-i18n-title="pinyin.playAudio" title="Play audio" data-i18n-aria-label="pinyin.playAudio" aria-label="Play audio">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <p class="py-hint" data-i18n="pinyin.listenHint">Listen and identify the sound.</p>

        <!-- Multiple choice options -->
        <div id="mc-options" class="hidden py-options"></div>

        <!-- Type answer input -->
        <form id="answer-form" class="hidden py-form">
          <input
            id="answer-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="e.g. ba4 or bà"
            data-i18n-placeholder="pinyin.placeholder"
            class="py-input"
          >
          <button type="submit" class="py-primary" data-i18n="pinyin.submit">Check</button>
        </form>
      </div>
    </div>

    <!-- Result area -->
    <div id="result-area" class="hidden">
      <div class="tr-card py-card-result">
        <div class="tr-result-head">
          <span id="result-status-icon" class="tr-status-icon" aria-hidden="true"></span>
          <span id="result-icon" class="tr-result-title"></span>
        </div>

        <div class="py-answer-row">
          <span id="result-correct-answer" class="py-answer"></span>
          <button id="result-play-btn" type="button" class="py-replay" data-i18n-title="pinyin.replay" title="Replay" data-i18n-aria-label="pinyin.replay" aria-label="Replay">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </button>
        </div>

        <div id="result-your-answer" class="hidden py-your-answer"></div>
        <div id="result-confusion" class="hidden py-confusion"></div>

        <div id="tone-variants-wrap" class="hidden">
          <div class="py-variants-title" data-i18n="pinyin.allTones">All tones</div>
          <div id="tone-variants" class="py-variants"></div>
        </div>

        <div class="tr-status-row">
          <div class="tr-status-left">
            <span id="bucket-info" class="hidden"></span>
            <span id="attempt-stats" class="tr-muted-sm"></span>
          </div>
          <span id="next-due-info" class="py-next-due"></span>
        </div>

        <button id="next-btn" type="button" class="py-primary py-next" data-i18n="pinyin.next">Next</button>
      </div>
    </div>

  </main>

{{end}}
